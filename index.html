<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Love ❤️</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; }
        #webcam { transform: scaleX(-1); position: fixed; bottom: 10px; left: 10px; width: 80px; height: 60px; border-radius: 5px; z-index: 5; opacity: 0.3; border: 1px solid white; pointer-events: none; }
        #overlay { position: fixed; inset: 0; background: radial-gradient(circle, #222, #000); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; color: white; transition: 0.5s; }
        button { padding: 15px 35px; margin: 10px; border-radius: 30px; border: none; font-weight: bold; cursor: pointer; font-size: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        #btnAudio { background: #00d2ff; color: white; }
        #btnStart { background: #ff4d94; color: white; display: none; }
        .hint { position: fixed; top: 20px; width: 100%; text-align: center; color: #ffb3d1; z-index: 10; font-weight: bold; text-shadow: 0 2px 4px #000; }
    </style>
</head>
<body>

    <div id="overlay">
        <h2>💖 Magic Love Experience 💖</h2>
        <button id="btnAudio" onclick="enableAudio()">🎵 1. Aktifkan Musik</button>
        <button id="btnStart" onclick="startApp()">🚀 2. Mulai Sekarang</button>
    </div>

    <div class="hint">✋ BUKA (FOTO & TEKS) | ✊ KEPAL (HATI PINK) | ✌️ RESET</div>
    <video id="webcam" autoplay playsinline></video>
    <audio id="bgm" loop><source src="nadhif.mp3" type="audio/mpeg"></audio>

    <script>
        let scene, camera, renderer, photo, textObj, hearts;
        let targetX = 0, targetY = 0, morph = 0, opacity = 0;
        let curMorph = 0, curOpacity = 0;

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.position.z = 12;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            const loader = new THREE.TextureLoader();
            loader.setCrossOrigin('anonymous');

            // 1. FOTO (Diletakkan di depan: Z = 2)
            loader.load('https://i.ibb.co/99XrbxzX/Desain-tanpa-judul-removebg-preview.png', (tex) => {
                const aspect = tex.image.width / tex.image.height;
                photo = new THREE.Mesh(
                    new THREE.PlaneGeometry(8 * aspect, 8),
                    new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: 0, depthWrite: false })
                );
                photo.position.z = 2; 
                scene.add(photo);
            });

            // 2. TULISAN HITAM (Diletakkan di antara foto dan hati: Z = 2.1)
            const can = document.createElement('canvas');
            const ctx = can.getContext('2d');
            can.width = 512; can.height = 128;
            ctx.font = 'bold 50px Arial';
            ctx.fillStyle = 'black'; 
            ctx.textAlign = 'center';
            ctx.fillText("I Love You Sayang", 256, 80);
            
            const txtTex = new THREE.CanvasTexture(can);
            textObj = new THREE.Mesh(
                new THREE.PlaneGeometry(6, 1.5),
                new THREE.MeshBasicMaterial({ map: txtTex, transparent: true, opacity: 0, depthWrite: false })
            );
            textObj.position.set(0, -4.2, 2.1); 
            scene.add(textObj);

            // 3. PARTIKEL HATI (Diletakkan paling belakang: Z = 0)
            const count = 10000;
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(count * 3);
            const tar = new Float32Array(count * 3);

            for(let i=0; i<count; i++) {
                pos[i*3] = (Math.random()-0.5) * 50;
                pos[i*3+1] = (Math.random()-0.5) * 50;
                pos[i*3+2] = (Math.random()-0.5) * 10;

                const t = Math.random() * Math.PI * 2;
                const r = 0.25; 
                tar[i*3] = 16 * Math.pow(Math.sin(t), 3) * r;
                tar[i*3+1] = (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * r;
                tar[i*3+2] = 0;
            }

            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geo.setAttribute('aTarget', new THREE.BufferAttribute(tar, 3));

            const mat = new THREE.ShaderMaterial({
                uniforms: { uMorph: {value: 0}, uTime: {value: 0} },
                vertexShader: `
                    uniform float uMorph;
                    uniform float uTime;
                    attribute vec3 aTarget;
                    void main() {
                        vec3 p = mix(position, aTarget, uMorph);
                        if(uMorph > 0.8) p *= (1.0 + sin(uTime * 3.0) * 0.03);
                        vec4 mv = modelViewMatrix * vec4(p, 1.0);
                        gl_PointSize = 4.5 * (300.0 / -mv.z);
                        gl_Position = projectionMatrix * mv;
                    }
                `,
                fragmentShader: `
                    void main() {
                        if(distance(gl_PointCoord, vec2(0.5)) > 0.5) discard;
                        gl_FragColor = vec4(1.0, 0.71, 0.75, 1.0); 
                    }
                `,
                transparent: true,
                depthTest: false // AGAR TIDAK MENUTUPI OBJEK LAIN
            });

            hearts = new THREE.Points(geo, mat);
            hearts.position.z = 0; 
            scene.add(hearts);
        }

        function enableAudio() {
            document.getElementById('bgm').play().catch(() => {});
            document.getElementById('btnAudio').style.display = 'none';
            document.getElementById('btnStart').style.display = 'block';
        }

        function startApp() {
            document.getElementById('overlay').style.opacity = '0';
            setTimeout(() => document.getElementById('overlay').style.display = 'none', 500);
            initMediaPipe();
        }

        function initMediaPipe() {
            const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
            hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.6 });
            hands.onResults((res) => {
                if (res.multiHandLandmarks && res.multiHandLandmarks[0]) {
                    const lm = res.multiHandLandmarks[0];
                    targetX = (0.5 - lm[9].x) * 20;
                    targetY = (0.5 - lm[9].y) * 15;

                    const isIndexUp = lm[8].y < lm[6].y;
                    const isMiddleUp = lm[12].y < lm[10].y;
                    const isRingUp = lm[16].y < lm[14].y;

                    // V-SIGN RESET
                    if (isIndexUp && isMiddleUp && !isRingUp) {
                        location.reload();
                    } else if (isIndexUp || isMiddleUp) {
                        morph = 0; opacity = 1;
                    } else {
                        morph = 1; opacity = 0;
                    }
                }
            });
            const cam = new Camera(document.getElementById('webcam'), {
                onFrame: async () => { await hands.send({image: document.getElementById('webcam')}); },
                width: 640, height: 480
            });
            cam.start();
        }

        function animate(t) {
            requestAnimationFrame(animate);
            curMorph += (morph - curMorph) * 0.1;
            curOpacity += (opacity - curOpacity) * 0.1;

            if(photo) {
                photo.position.set(targetX, targetY, 2);
                photo.material.opacity = curOpacity;
            }
            if(textObj) {
                textObj.position.set(targetX, targetY - 4.2, 2.1);
                textObj.material.opacity = curOpacity;
            }
            if(hearts) {
                hearts.position.set(targetX, targetY, 0);
                hearts.material.uniforms.uMorph.value = curMorph;
                hearts.material.uniforms.uTime.value = t * 0.001;
            }
            renderer.render(scene, camera);
        }

        init(); animate();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
